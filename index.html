<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Livro de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome oficial para carregar os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cartao-aplicacao">
        <!-- Sua foto de perfil salva como foto2.png -->
        <div class="moldura-perfil">
            <img src="foto2.png" alt="Foto de Perfil" class="foto-perfil">
        </div>

        <header class="cabecalho-aplicacao">
            <h1>Crônicas do Dia</h1>
            <button class="botao-icone" id="botao-alternar-tema" title="Alternar Iluminação">
                <i class="fa-solid fa-feather"></i>
            </button>
        </header>
        
        <div class="caixa-entrada">
            <input type="text" id="campo-tarefa" placeholder="Escreva um novo feito..." maxlength="40">
            <button class="botao-principal" id="botao-adicionar">
                <i class="fa-solid fa-plus"></i> Inserir
            </button>
        </div>
        
        <ul class="lista-tarefas" id="lista-tarefas">
            <!-- Gerado dinamicamente via JS -->
        </ul>
        
        <footer class="rodape-aplicacao">
            <span id="contador-tarefas">0 registros no tomo</span>
            <button id="botao-limpar-concluidas" class="botao-secundario" title="Limpar Concluídas">
                Expurgar Concluídos
            </button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
